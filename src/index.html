<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css"
        integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS" crossorigin="anonymous">
    <title>Hello, world!</title>
</head>

<body>

    <main>
        <section class="py-4 px-3 py-sm-5 px-sm-4 mb-4 bg-body-secondary rounded text-center">
            <div class="container">
                <h1><img src="https://nalbam.com/static/logo/nginx.png" alt="nginx"></h1>
                <h3 id="host">sample-web</h3>
                <p>
                    <button class="btn btn-primary btn-thumbs-up"><i class="fa-regular fa-thumbs-up"></i> <span
                            id="thumbs-up-count">0</span></button>
                    <button class="btn btn-danger btn-thumbs-down"><i class="fa-regular fa-thumbs-down"></i> <span
                            id="thumbs-down-count">0</span></button>
                </p>
            </div>
        </section>
    </main>

    <!-- counter.js needs jQuery. -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://nalbam.com/static/sample/counter.js"></script>
</body>

</html>
