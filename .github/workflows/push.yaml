name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the release platforms without pushing.
      - name: Build linux/amd64 and linux/arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: sample-web:test

      - name: Check Nginx version
        run: |
          version="$(docker run --rm sample-web:test nginx -v 2>&1)"
          echo "$version"
          [[ "$version" == "nginx version: nginx/1.30."* ]]

      - name: Run container
        run: docker run -d --name sample-web -p 8080:80 sample-web:test

      - name: Smoke test
        run: test/smoke.sh http://localhost:8080

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs sample-web || true
          docker rm -f sample-web || true
