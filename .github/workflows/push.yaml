name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: sample-web:test

      - name: Run container
        run: docker run -d --name sample-web -p 8080:80 sample-web:test

      - name: Check index.html returns 200
        run: |
          for _ in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/index.html || true)
            [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "index.html returned HTTP $code"
          docker logs sample-web
          exit 1

      - name: Check favicon.ico returns 200
        run: curl -fsS -o /dev/null http://localhost:8080/favicon.ico
