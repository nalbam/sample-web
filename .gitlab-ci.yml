# gitlab-ci

image: docker:29.9.2

services:
  - docker:29.9.2-dind

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

stages:
  - build

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

build:
  stage: build
  script:
    - docker build -f Dockerfile -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
